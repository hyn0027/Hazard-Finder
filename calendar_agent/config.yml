chatbot:
  model: "gpt-5"

Agent_system:
  system_aim: "Assist user to manage their google calendar"
  tools:
    - name: "get_events"
      description: "Fetch events from google calendar"
      parameters:
        - name: "date"
          description: "Date to fetch events for, in YYYY-MM-DD format"
      response:
        - name: "events"
          description: "List of event IDs on the specified date"
    - name: "get_event_details"
      description: "Fetch details of a specific event"
      parameters:
        - name: "event_id"
          description: "ID of the event to fetch details for"
      response:
        - name: "title"
          description: "Title of the event"
        - name: "date"
          description: "Date of the event in YYYY-MM-DD format"
        - name: "time"
          description: "Time of the event in HH:MM format"
        - name: "description"
          description: "Description of the event"
        - name: "participants"
          description: "List of participants, with names and emails, in the event"
        - name: "location"
          description: "Location of the event"
    - name: "create_event"
      description: "Create a new event in google calendar"
      parameters:
        - name: "title"
          description: "Title of the event"
        - name: "date"
          description: "Date of the event in YYYY-MM-DD format"
        - name: "time"
          description: "Time of the event in HH:MM format"
        - name: "description"
          description: "Description of the event"
        - name: "participants"
          description: "List of participants, with names and email addresses, to add to the event"
        - name: "location"
          description: "Location of the event"
    - name: "delete_event"
      description: "Delete an event from google calendar"
      parameters:
        - name: "event_id"
          description: "ID of the event to delete"
    - name: "update_event"
      description: "Update details of an existing event in google calendar"
      parameters:
        - name: "event_id"
          description: "ID of the event to update"
        - name: "title"
          description: "Updated title of the event (optional)"
        - name: "date"
          description: "Updated date of the event in YYYY-MM-DD format (optional)"
        - name: "time"
          description: "Updated time of the event in HH:MM format (optional)"
        - name: "description"
          description: "Updated description of the event (optional)"
        - name: "participants"
          description: "Updated list of participants, with names and email addresses, to add to the event (optional)"
        - name: "location"
          description: "Updated location of the event (optional)"
    - name: "send_confirmation_email"
      description: "Send a confirmation email to participants about an event"
      parameters:
        - name: "event_id"
          description: "ID of the event to send confirmation for"
        - name: "participants"
          description: "List of participants, with names and email addresses, to send the confirmation email to"
        - name: "message"
          description: "Custom message to include in the confirmation email (optional)"
    - name: "check_weather"
      description: "Check the weather for a specific location and date"
      parameters:
        - name: "location"
          description: "Location to check the weather for"
        - name: "date"
          description: "Date to check the weather for, in YYYY-MM-DD format"
      response:
        - name: "weather_forecast"
          description: "Weather forecast for the specified location and date"

  use_cases:
    - "Fetch and display all events for a specific date"
    - "Create a new event with specified details and participants"
    - "Update an existing event's details"
    - "Delete an event by its ID"
    - "Send confirmation emails to participants of an event"
    - "Check the weather for an event's location and date"
    - "Check for conflicts when creating or updating events"
    - "Suggest actions based on user's existing calendar and preferences"

checkpoint: "identify_values"
