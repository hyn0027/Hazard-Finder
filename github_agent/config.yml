chatbot:
  model: "gpt-5"

Agent_system:
  system_aim: "Assist user to manage their Github Repos"
  tools:
    - name: "list_repos"
      description: "Fetch list of repositories for a user"
      parameters:
        - name: "username"
          description: "GitHub username to fetch repositories for"
      response:
        - name: "repos"
          description: "List of repository names for the specified user"
    - name: "get_repo_details"
      description: "Fetch details of a specific repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository to fetch details for"
        - name: "username"
          description: "GitHub username who owns the repository"
      response:
        - name: "success"
          description: "Boolean indicating if the fetch was successful"
        - name: "description"
          description: "Description of the repository"
        - name: "stars"
          description: "Number of stars the repository has"
        - name: "forks"
          description: "Number of forks of the repository"
        - name: "language"
          description: "Primary programming language used in the repository"
    - name: "list_issues"
      description: "Fetch list of issues for a specific repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository to fetch issues for"
        - name: "username"
          description: "GitHub username who owns the repository"
      response:
        - name: "issues"
          description: "List of issue titles and their numbers in the specified repository"
    - name: "read_issue"
      description: "Read details of a specific issue in a repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository containing the issue"
        - name: "username"
          description: "GitHub username who owns the repository"
        - name: "issue_number"
          description: "Number of the issue to read"
      response:
        - name: "title"
          description: "Title of the issue"
        - name: "body"
          description: "Body content of the issue"
        - name: "state"
          description: "State of the issue (open/closed)"
        - name: "comments"
          description: "List of comments on the issue"
    - name: "create_issue"
      description: "Create a new issue in a specific repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository to create the issue in"
        - name: "username"
          description: "GitHub username who owns the repository"
        - name: "title"
          description: "Title of the new issue"
        - name: "body"
          description: "Body content of the new issue"
      response:
        - name: "issue_number"
          description: "Number of the newly created issue"
        - name: "issue_url"
          description: "URL of the newly created issue"
    - name: "list_PRs"
      description: "Fetch list of pull requests for a specific repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository to fetch pull requests for"
        - name: "username"
          description: "GitHub username who owns the repository"
      response:
        - name: "pull_requests"
          description: "List of pull request titles and their numbers in the specified repository"
    - name: "read_PR"
      description: "Read details of a specific pull request in a repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository containing the pull request"
        - name: "username"
          description: "GitHub username who owns the repository"
        - name: "pr_number"
          description: "Number of the pull request to read"
      response:
        - name: "title"
          description: "Title of the pull request"
        - name: "body"
          description: "Body content of the pull request"
        - name: "state"
          description: "State of the pull request (open/closed/merged)"
        - name: "comments"
          description: "List of comments on the pull request"
    - name: "create_PR"
      description: "Create a new pull request in a specific repository"
      parameters:
        - name: "repo_name"
          description: "Name of the repository to create the pull request in"
        - name: "username"
          description: "GitHub username who owns the repository"
        - name: "title"
          description: "Title of the new pull request"
        - name: "body"
          description: "Body content of the new pull request"
        - name: "head_branch"
          description: "Name of the branch where changes are implemented"
        - name: "base_branch"
          description: "Name of the branch you want to merge changes into"
      response:
        - name: "pr_number"
          description: "Number of the newly created pull request"
        - name: "pr_url"
          description: "URL of the newly created pull request"
    - name: "code_sandbox"
      description: "A secure environment to run and test code snippets, with full read/write access to all of the user's public and private GitHub repositories, while other internet access is disabled."
      parameters:
        - name: "action"
          description: "Action to perform in the sandbox, including 'read file', 'write file', 'execute command'"
        - name: "file_name"
          description: "Name of the file to read or write, if applicable"
        - name: "content"
          description: "Content to write to the file, if applicable"
        - name: "command"
          description: "Command to execute in the sandbox, if applicable"
      response:
        - name: "output"
          description: "Output from the sandbox action, including file contents or command results"
  use_cases:
    - "List all repositories for a user"
    - "Fetch details of a specific repository"
    - "Read code from a repository and respond to user questions about it"
    - "Read and summarize an issue from a repository"
    - "Suggest ways to fix issues"
    - "Automatically fix issues"
    - "Create new issues based on user input"
    - "Read and summarize a pull request from a repository"
    - "Suggest improvements to a pull request"
    - "Approve or request changes to a pull request"
    - "Merge pull requests"
    - "Create new pull requests based on user input"
    - "Create, delete, or modify files and push to the repo using the code sandbox"
    - "Run code using the code sandbox"

checkpoint: "identify_values"
