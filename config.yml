chatbot:
  model: "gpt-5"

system:
  system_aim: |
    A healthcare communication system that uses ML models to process inbound fax referrals, extract patient and clinical information, route to appropriate providers, and handle call center inquiries through conversational AI. 
    The system includes document classification, data extraction, voice recognition, intent classification, and automated response generation while monitoring extraction accuracy, routing precision, conversation quality, and escalation patterns.
  ML_usage: |
    Computer vision models process and extract data from inbound fax referrals (OCR); 
    Classification models categorize referral types and urgency levels; 
    NLP models extract patient demographics, clinical information, and provider details; 
    Routing models match referrals to appropriate specialists based on specialty, availability, and criteria; 
    Validation models detect incomplete or missing information requiring human review.
  use_cases:
    - "Referral coordinators use the system to automatically process incoming fax referrals and route them to appropriate providers"
    - "Medical practices and specialists use the system to receive, triage, and prioritize patient referrals based on urgency and clinical criteria"
    - "Healthcare networks use the system to track referral volumes, routing accuracy, and processing times across multiple facilities"
    - "Quality and operations teams use the system to monitor extraction accuracy, identify incomplete referrals, and optimize routing workflows"

checkpoint: identify_hazards

dropout: 0.3
